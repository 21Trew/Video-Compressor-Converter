<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Video Compressor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body {
  margin: 0;
  background: #0e0e11;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.app {
  width: 100%;
  max-width: 420px;
  background: #16161b;
  padding: 24px;
  border-radius: 14px;
}
h1 { margin: 0 0 6px; font-size: 22px; }
p { margin: 0 0 16px; color: #aaa; font-size: 14px; }

label { font-size: 13px; color: #ccc; }
input, select, button {
  width: 100%;
  margin-top: 6px;
  margin-bottom: 14px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}
input, select { background: #222; color: #fff; }
button {
  background: #4f7cff;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
.status { font-size: 13px; color: #7cf; }
</style>
</head>

<body>
<div class="app">
  <h1>Video Tool</h1>
  <p>Сжатие и конвертация видео</p>

  <label>Видео</label>
  <input type="file" id="file" accept="video/*"/>

  <label>Режим</label>
  <select id="mode">
    <option value="compress">Сжать</option>
    <option value="convert">Конвертировать</option>
    <option value="both">Сжать + конвертировать</option>
  </select>

  <label>Качество (меньше = сильнее сжатие)</label>
  <input type="number" id="crf" value="28" min="18" max="40"/>

  <label>Формат</label>
  <select id="format">
    <option value="mp4">MP4</option>
    <option value="webm">WEBM</option>
    <option value="mov">MOV</option>
  </select>

  <button id="start">Обработать</button>
  <div class="status" id="status"></div>
</div>

<script type="module">
import { createFFmpeg, fetchFile } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js";

const ffmpeg = createFFmpeg({ log: true });

const fileInput = document.getElementById("file");
const startBtn = document.getElementById("start");
const status = document.getElementById("status");

startBtn.onclick = async () => {
  if (!fileInput.files.length) {
    alert("Выбери видео");
    return;
  }

  startBtn.disabled = true;
  status.textContent = "Загрузка FFmpeg (первый раз ~5–10 сек)…";

  if (!ffmpeg.isLoaded()) {
    await ffmpeg.load();
  }

  const file = fileInput.files[0];
  const mode = modeSelect.value;
  const crf = document.getElementById("crf").value;
  const format = document.getElementById("format").value;

  const input = "input.mp4";
  const output = `output.${format}`;

  ffmpeg.FS("writeFile", input, await fetchFile(file));
  status.textContent = "Обработка видео…";

  let args;

  if (mode === "compress" || mode === "both") {
    args = ["-i", input, "-vcodec", "libx264", "-crf", crf, output];
  } else {
    args = ["-i", input, output];
  }

  await ffmpeg.run(...args);

  const data = ffmpeg.FS("readFile", output);
  const url = URL.createObjectURL(new Blob([data.buffer]));

  const a = document.createElement("a");
  a.href = url;
  a.download = output;
  a.click();

  status.textContent = "Готово ✔";
  startBtn.disabled = false;
};
</script>
</body>
</html>
